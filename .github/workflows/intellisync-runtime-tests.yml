name: IntelliSync runtime tests

on:
  push:
    paths:
      - "intellisync/**"
      - ".github/workflows/intellisync-runtime-tests.yml"
  pull_request:
    paths:
      - "intellisync/**"
      - ".github/workflows/intellisync-runtime-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run IntelliSync unit tests
        run: python -m unittest discover -s intellisync/tests -v
